openai.api.key=${OPENAI_API_KEY}
github.app.id=${GITHUB_APP_ID}
github.app.private-key-path=${GITHUB_PRIVATE_KEY_PATH}
github.webhook.secret=${GITHUB_WEBHOOK_SECRET}
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_code_reviewer?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG
topic.pr-review=ai-review-events-v2

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.arfin.code.review.kafka.PRReviewConsumer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.enable-auto-commit=true

server.port=${PORT:8080}

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Connection Pool
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms